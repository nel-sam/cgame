name: dragonpuppyfun
description: A fun simple game.

version: 1.4.0+1.4

environment:
  sdk: '>=2.16.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flame: ^1.8.2
  flame_audio: '^2.0.5'
  # google_fonts: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/images/ui/
    - assets/images/numbers/

analyzer:
  strong-mode: true
  language:
    enableSuperMixins: true

# flutter pub run flutter_launcher_icons:main
flutter_icons:
  android: true
  ios: true
  # logo_512.png must have the alpha channel removed using Gimp or PhotoShop
  image_path_android: assets/icon.png
  image_path_ios: assets/icon.png
  adaptive_icon_background: assets/icon.png
  adaptive_icon_foreground: assets/icon.png

# Install on device via USB
# flutter build ios --release
# flutter install

# Build deployable IOS:         flutter build ipa
# Build deployable Android:     flutter build appbundle